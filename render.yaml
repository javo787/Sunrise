# Blueprint для Render, БЕСПЛАТНЫЙ тариф.
# Бесплатный сервис «засыпает» через 15 минут без входящих запросов — поэтому внешний планировщик
# cron-job.org дёргает /api/cron/publish-and-escalate каждую минуту (см. DEPLOY.md, шаг 8): это и
# «будит»/держит сервис, и запускает эскалацию. 750 бесплатных часов в месяц на аккаунт хватает
# ровно на ОДИН круглосуточный сервис (31 день = 744 ч) — других бесплатных сервисов не создавайте.
services:
  - type: web
    name: sunrise-crm
    runtime: node
    plan: free
    region: frankfurt
    # --include=dev: для сборки нужны typescript и @types. SKIP_TYPECHECK: типы проверяет CI, а на
    # 512 МБ проверка типов при сборке лишняя. Запуск без обёртки npm экономит ~75 МБ памяти.
    buildCommand: npm ci --include=dev && SKIP_TYPECHECK=1 NODE_OPTIONS=--max-old-space-size=400 npm run build
    startCommand: node node_modules/next/dist/bin/next start
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - { key: NODE_VERSION, value: "20" }
      - { key: TIMEZONE, value: Asia/Dushanbe }
      - { key: MONGODB_DB, value: sunrise }
      - { key: ESCALATION_MINUTES, value: "15" }
      - { key: MANUAL_LEADS_ASSIGN, value: self }
      - { key: LLM_PROVIDER, value: gemini }
      - { key: GEMINI_MODEL, value: gemini-2.5-flash }
      - { key: GEMINI_MODEL_FALLBACK_1, value: gemini-2.5-flash-lite }
      # секреты вводятся в панели Render (значения и пояснения — .env.example и DEPLOY.md)
      - { key: MONGODB_URI, sync: false }
      - { key: PUBLIC_BASE_URL, sync: false }
      - { key: CRON_SECRET, sync: false }
      - { key: TELEGRAM_BOT_TOKEN, sync: false }
      - { key: TELEGRAM_WEBHOOK_SECRET, sync: false }
      - { key: TELEGRAM_MANAGERS_CHAT_ID, sync: false }
      - { key: TELEGRAM_ADMIN_IDS, sync: false }
      - { key: EVOLUTION_API_URL, sync: false }
      - { key: EVOLUTION_API_KEY, sync: false }
      - { key: EVOLUTION_INSTANCE, sync: false }
      - { key: WHATSAPP_WEBHOOK_SECRET, sync: false }
      - { key: META_APP_SECRET, sync: false }
      - { key: META_VERIFY_TOKEN, sync: false }
      - { key: META_PAGE_ACCESS_TOKEN, sync: false }
      - { key: GEMINI_API_KEY, sync: false }
      - { key: GOOGLE_SERVICE_ACCOUNT_JSON, sync: false }
      - { key: SHEETS_SPREADSHEET_ID, sync: false }
      - { key: SHEETS_COLUMNS, sync: false }
